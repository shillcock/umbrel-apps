manifestVersion: 1.1
id: proton-bridge
name: Proton Bridge
icon: https://raw.githubusercontent.com/shillcock/umbrel-apps/main/proton-bridge/icon.svg
category: networking
version: "0.1.0"
tagline: Proton Mail IMAP/SMTP bridge, exposed to your Tailscale network
description: >-
  Runs Proton Mail Bridge as a background IMAP/SMTP gateway on your Umbrel,
  with the mail ports published only on the Pro's Tailscale IP so devices on
  your tailnet (like JD) can read and send mail. Nothing is exposed to the LAN
  or the internet.


  Proton does not offer direct IMAP. Bridge decrypts locally and speaks IMAP
  (port 1143, STARTTLS) and SMTP (port 1025, STARTTLS) on the Tailscale
  interface only.


  The app tile is an operator console (ttyd) behind two gates: your Umbrel
  login, then HTTP basic auth. Username is `bridge`. Password is the one
  Umbrel shows on this app's tile. First run: open the tile, type `login-cli`,
  sign in with Proton + 2FA, then `info` to copy the mailbox password into
  1Password. Mail stays up after you close the tab.


  Requirements:

  - A paid Proton plan that includes Bridge (Mail Plus or higher). Free
    accounts are refused.

  - You log in once in this app's console. Do not paste Proton passwords into
    chat.


  Security notes:

  - The console is Umbrel-login then ttyd basic auth (tile password). Do not
    publish port 7681 or tunnel this app to the public internet.

  - IMAP/SMTP are bound to the Tailscale IP only (100.103.38.124). If the
    Pro's Tailscale IP changes, update the port bindings in docker-compose.yml.

  - This wraps the unofficial shenxn/protonmail-bridge image (Proton Bridge
    is GPL-3.0), pinned by sha256. Keys live on this app's data volume.
releaseNotes: >-
  0.1.0: initial release. Fork with IMAP/SMTP published on the Tailscale
  interface only (1143/1025), browser-console login, no terminal needed.
